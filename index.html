<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>یک قرار ❤️</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      font-family: Tahoma, Arial, sans-serif;
      background: linear-gradient(135deg, #ffdce7, #fff5f8);
      color: #4b2732;
    }

    .card {
      width: 90%;
      max-width: 420px;
      padding: 35px 25px;
      text-align: center;
      background: rgba(255,255,255,0.94);
      border-radius: 28px;
      box-shadow: 0 15px 40px rgba(120,50,75,.2);
    }

    .emoji {
      font-size: 55px;
      margin-bottom: 15px;
    }

    h1 {
      font-size: 26px;
      margin-bottom: 30px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 15px;
      padding: 15px;
      margin: 7px 0;
      font-size: 18px;
      cursor: pointer;
    }

    .yes {
      background: #e94f78;
      color: white;
    }

    .no {
      background: #eeeeee;
      color: #999;
      cursor: not-allowed;
    }

    input {
      width: 100%;
      padding: 13px;
      margin: 8px 0 18px;
      border: 1px solid #e5b8c5;
      border-radius: 12px;
      font-size: 16px;
    }

    label {
      display: block;
      text-align: right;
      font-size: 14px;
    }

    .hidden {
      display: none;
    }

    .final {
      font-size: 21px;
      line-height: 2.2;
    }

    .small {
      color: #97717c;
      font-size: 13px;
      margin-top: 15px;
    }
  </style>
</head>

<body>

  <div class="card">

    <!-- صفحه اول -->
    <div id="page1">

      <div class="emoji">❤️</div>

      <h1>
        با من میای سر قرار؟
      </h1>

      <button class="yes" onclick="nextPage()">
        بله ❤️
      </button>

      <button class="no" disabled>
        نه
      </button>

      <div class="small">
        یه قرار کوچیک و قشنگ 😊
      </div>

    </div>


    <!-- صفحه دوم -->
    <div id="page2" class="hidden">

      <div class="emoji">📅</div>

      <h1>
        پس بریم قرارمون رو تنظیم کنیم ❤️
      </h1>

      <label>
        تاریخ قرار
      </label>

      <input
        type="date"
        id="date"
      >

      <label>
        ساعت قرار
      </label>

      <input
        type="time"
        id="time"
      >

      <button
        class="yes"
        onclick="confirmDate()"
      >
        ثبت قرار ❤️
      </button>

    </div>


    <!-- صفحه سوم -->
    <div id="page3" class="hidden">

      <div class="emoji">
        🥰
      </div>

      <div class="final">

        <strong>
          خوشحالم که بهم نه نگفتی ❤️
        </strong>

        <br>

        خودم میام دنبالت 😊

      </div>

      <p id="result"></p>

    </div>

  </div>


<script>

function nextPage() {

  document.getElementById("page1")
    .classList.add("hidden");

  document.getElementById("page2")
    .classList.remove("hidden");

}


function confirmDate() {

  const date =
    document.getElementById("date").value;

  const time =
    document.getElementById("time").value;


  if (!date || !time) {

    alert("لطفاً تاریخ و ساعت رو انتخاب کن ❤️");

    return;
  }


  const selectedDate =
    new Date(date + "T00:00:00");


  const formattedDate =
    new Intl.DateTimeFormat(
      "fa-IR",
      {
        year: "numeric",
        month: "long",
        day: "numeric"
      }
    ).format(selectedDate);


  document.getElementById("result").innerHTML =
    "قرارمون: " +
    formattedDate +
    " ساعت " +
    time +
    " ❤️";


  document.getElementById("page2")
    .classList.add("hidden");

  document.getElementById("page3")
    .classList.remove("hidden");

}

</script>

</body>
</html>
